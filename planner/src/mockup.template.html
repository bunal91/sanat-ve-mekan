<meta charset="utf-8">
<title>listing image</title>
{{FONTS}}
<style>
  :root{ --ink:#23181f; --soft:#6e6068; --faint:#9a8f94;
         --s1:#f2a65a; --s2:#ee6c4d; --s3:#c43e7a; --s4:#4b2e83; }
  html,body{ margin:0; }
  body{ width:2000px; height:2000px; background:{{BG}};
        font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; color:var(--ink);
        display:flex; flex-direction:column; overflow:hidden;
        -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .frame{ flex:1; display:flex; flex-direction:column; padding:{{PAD}}; box-sizing:border-box; }
  .eyebrow{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700;
            text-transform:uppercase; letter-spacing:.3em; font-size:30px; color:var(--soft); }
  h1{ font-family:"Bodoni Moda","Didot",Georgia,serif; font-weight:500; font-size:{{H1}};
      line-height:.88; margin:22px 0 0; letter-spacing:-.01em; }
  h1 em{ font-style:italic; font-weight:400; }
  .rule{ width:300px; height:8px; border-radius:5px; margin-top:30px;
         background:linear-gradient(90deg,var(--s1),var(--s2) 38%,var(--s3) 72%,var(--s4)); }
  .sub{ font-size:34px; line-height:1.45; color:var(--soft); margin-top:26px; max-width:1100px; }
  .shots{ flex:1; display:flex; align-items:center; justify-content:center; gap:{{GAP}}; }
  .shots img{ box-shadow:0 40px 90px rgba(35,24,31,.22); background:#fff; }
  .badges{ display:flex; gap:18px; flex-wrap:wrap; }
  .badge{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700;
          text-transform:uppercase; letter-spacing:.16em; font-size:26px; color:var(--ink);
          border:2px solid var(--ink); border-radius:999px; padding:14px 26px; }
  .split{ display:grid; grid-template-columns:.92fr 1.08fr; gap:70px; align-items:center; flex:1; }
  .split .txt{ display:flex; flex-direction:column; }
  .split img{ width:100%; box-shadow:0 40px 90px rgba(35,24,31,.22); background:#fff; }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:40px 70px; margin-top:10px; }
  .item{ border-top:2px solid rgba(35,24,31,.16); padding-top:18px; }
  .item b{ display:block; font-family:"Barlow Condensed","Arial Narrow",sans-serif;
           font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:30px; }
  .item span{ display:block; font-size:29px; color:var(--soft); margin-top:8px; line-height:1.35; }
  .caption{ font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600;
            text-transform:uppercase; letter-spacing:.2em; font-size:26px; color:var(--faint);
            text-align:center; margin-top:26px; }
</style>
<div class="frame">{{CONTENT}}</div>
