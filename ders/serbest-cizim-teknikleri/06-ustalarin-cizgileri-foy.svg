<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="210" height="297" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1B1F24"/></marker></defs>
<g font-family="Helvetica, Arial, sans-serif">
<text x="14" y="17.6" font-size="7.6" font-weight="bold" letter-spacing="1.1" fill="#1B1F24">USTALARIN ÇİZGİLERİ</text>
<text x="196" y="15" font-size="2.9" letter-spacing="0.5" fill="#2A6289" text-anchor="end">IMC321 SERBEST ÇİZİM TEKNİKLERİ</text>
<text x="196" y="18.8" font-size="2.6" fill="#7A828A" text-anchor="end">ÖĞRENCİ FÖYÜ</text>
<line x1="14" y1="21.2" x2="196" y2="21.2" stroke="#1B1F24" stroke-width="0.7"/>
<text x="14" y="26.2" font-size="3.0" fill="#1B1F24">Sekiz sanatçının çizgisini sırayla taklit edeceksiniz. Amaç onlar gibi çizmek değil; <tspan font-weight="bold">ellerini ödünç alıp kendi elinize ne olduğunu görmek.</tspan></text>
<text x="14" y="30.6" font-size="3.0" fill="#1B1F24">Bugün elinizde tek bir çizgi var. Dersin sonunda <tspan font-weight="bold">sekiz</tspan> olacak — ve hangisini ne zaman kullanacağınıza siz karar vereceksiniz.</text>
<text x="14" y="38" font-size="3.5" font-weight="bold" letter-spacing="1.0" fill="#2A6289">1 · SAYFANI SEKİZE BÖL</text>
<line x1="14" y1="39.6" x2="196" y2="39.6" stroke="#D5DAE0" stroke-width="0.35"/>
<rect x="14" y="45.4" width="23" height="31" fill="none" stroke="#1B1F24" stroke-width="0.6"/>
<text x="25.5" y="79.9" font-size="2.35" fill="#7A828A" text-anchor="middle">sayfan</text>
<path d="M 39 60.9 L 43.4 60.9" stroke="#1B1F24" stroke-width="0.5" marker-end="url(#ar)"/>
<rect x="45.6" y="45.4" width="23" height="31" fill="none" stroke="#1B1F24" stroke-width="0.6"/>
<line x1="57.1" y1="45.4" x2="57.1" y2="76.4" stroke="#2A6289" stroke-width="0.5" stroke-dasharray="1.4 1.2"/>
<text x="57.1" y="79.9" font-size="2.35" fill="#7A828A" text-anchor="middle">eninden ikiye</text>
<path d="M 70.6 60.9 L 75 60.9" stroke="#1B1F24" stroke-width="0.5" marker-end="url(#ar)"/>
<rect x="77.2" y="45.4" width="23" height="31" fill="none" stroke="#1B1F24" stroke-width="0.6"/>
<line x1="88.7" y1="45.4" x2="88.7" y2="76.4" stroke="#2A6289" stroke-width="0.5" stroke-dasharray="1.4 1.2"/>
<line x1="77.2" y1="60.9" x2="100.2" y2="60.9" stroke="#2A6289" stroke-width="0.5" stroke-dasharray="1.4 1.2"/>
<text x="88.7" y="79.9" font-size="2.35" fill="#7A828A" text-anchor="middle">boyundan ikiye</text>
<path d="M 102.2 60.9 L 106.6 60.9" stroke="#1B1F24" stroke-width="0.5" marker-end="url(#ar)"/>
<rect x="108.8" y="45.4" width="23" height="31" fill="none" stroke="#1B1F24" stroke-width="0.6"/>
<line x1="120.3" y1="45.4" x2="120.3" y2="76.4" stroke="#2A6289" stroke-width="0.5" stroke-dasharray="1.4 1.2"/>
<line x1="108.8" y1="60.9" x2="131.8" y2="60.9" stroke="#2A6289" stroke-width="0.5" stroke-dasharray="1.4 1.2"/>
<line x1="108.8" y1="53.15" x2="131.8" y2="53.15" stroke="#2A6289" stroke-width="0.5" stroke-dasharray="1.4 1.2"/>
<line x1="108.8" y1="68.65" x2="131.8" y2="68.65" stroke="#2A6289" stroke-width="0.5" stroke-dasharray="1.4 1.2"/>
<text x="120.3" y="79.9" font-size="2.35" fill="#7A828A" text-anchor="middle">bir kez daha</text>
<path d="M 133.8 60.9 L 138.2 60.9" stroke="#1B1F24" stroke-width="0.5" marker-end="url(#ar)"/>
<rect x="140.4" y="45.4" width="23" height="31" fill="#F3F5F8" stroke="#1B1F24" stroke-width="0.7"/>
<line x1="140.4" y1="53.15" x2="163.4" y2="53.15" stroke="#1B1F24" stroke-width="0.4"/>
<line x1="140.4" y1="60.9" x2="163.4" y2="60.9" stroke="#1B1F24" stroke-width="0.4"/>
<line x1="140.4" y1="68.65" x2="163.4" y2="68.65" stroke="#1B1F24" stroke-width="0.4"/>
<line x1="151.9" y1="45.4" x2="151.9" y2="76.4" stroke="#1B1F24" stroke-width="0.4"/>
<text x="146.15" y="50.875" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">1</text>
<text x="157.65" y="50.875" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">2</text>
<text x="146.15" y="58.625" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">3</text>
<text x="157.65" y="58.625" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">4</text>
<text x="146.15" y="66.375" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">5</text>
<text x="157.65" y="66.375" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">6</text>
<text x="146.15" y="74.125" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">7</text>
<text x="157.65" y="74.125" font-size="4.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">8</text>
<text x="151.9" y="79.9" font-size="2.4" font-weight="bold" fill="#1B1F24" text-anchor="middle">numaraları yaz</text>
<text x="168.4" y="56.5" font-size="2.9" font-weight="bold" fill="#2A6289">↓ YUKARIDAN AŞAĞI</text>
<text x="168.4" y="60.1" font-size="2.9" font-weight="bold" fill="#2A6289">YAVAŞLIYOR</text>
<text x="168.4" y="64.5" font-size="2.55" fill="#7A828A">1 en serbest, 8 en disiplinli.</text>
<text x="168.4" y="67.9" font-size="2.55" font-weight="bold" fill="#1B1F24">Sırayı bozma.</text>
<text x="14" y="86.8" font-size="3.5" font-weight="bold" letter-spacing="1.0" fill="#2A6289">2 · HER KUTUDA NE YAPACAKSIN — 6 dakika</text>
<line x1="14" y1="88.4" x2="196" y2="88.4" stroke="#D5DAE0" stroke-width="0.35"/>
<text x="14" y="94.1" font-size="2.7" font-weight="bold" fill="#2A6289">0:00–0:30</text>
<text x="30.5" y="94.1" font-size="2.7" font-weight="bold" fill="#1B1F24">Sadece BAK.</text>
<text x="66" y="94.1" font-size="2.7" fill="#7A828A">Kalem masada. Ekrandaki çizime bak; izin nasıl yapıldığını anla.</text>
<text x="14" y="98.4" font-size="2.7" font-weight="bold" fill="#2A6289">0:30–1:30</text>
<text x="30.5" y="98.4" font-size="2.7" font-weight="bold" fill="#1B1F24">Kenarda DENE.</text>
<text x="66" y="98.4" font-size="2.7" fill="#7A828A">Müsvedde kâğıtta izi bul. Sayfana henüz dokunma.</text>
<text x="14" y="102.7" font-size="2.7" font-weight="bold" fill="#2A6289">1:30–5:00</text>
<text x="30.5" y="102.7" font-size="2.7" font-weight="bold" fill="#1B1F24">Kutuyu O İZLE DOLDUR.</text>
<text x="66" y="102.7" font-size="2.7" fill="#7A828A">Nesne çizme, benzerlik arama — <tspan font-weight="bold">yalnızca iz.</tspan></text>
<text x="14" y="107" font-size="2.7" font-weight="bold" fill="#2A6289">5:00–6:00</text>
<text x="30.5" y="107" font-size="2.7" font-weight="bold" fill="#1B1F24">ÜÇ SAYIYI yaz.</text>
<text x="66" y="107" font-size="2.7" fill="#7A828A">Kutunun altına: tempo (BPM) / kesinti (2 cm'de kopma) / yoğunluk (2×2 cm'de iz).</text>
<rect x="14" y="111.7" width="182" height="7.0" fill="#F3F5F8" stroke="#1B1F24" stroke-width="0.5"/>
<text x="16.4" y="116.1" font-size="2.75" fill="#1B1F24"><tspan font-weight="bold">Kutuya hiçbir nesne çizilmez.</tspan> Ne bardak, ne sandalye, ne yüz — sadece iz. <tspan font-weight="bold">Silgi yok:</tspan> kutu bitince geri dönülmez.</text>
<text x="14" y="122.9" font-size="3.5" font-weight="bold" letter-spacing="1.0" fill="#2A6289">3 · SEKİZ ÇİZGİ — sırasıyla</text>
<line x1="14" y1="124.5" x2="196" y2="124.5" stroke="#D5DAE0" stroke-width="0.35"/>
<text x="14" y="130.5" font-size="4.6" font-weight="bold" fill="#1B1F24">1</text>
<text x="20" y="129.3" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">CY TWOMBLY</text>
<text x="20" y="132.8" font-size="2.5" fill="#7A828A">kurşun + kuru boya</text>
<text x="58" y="129.3" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">180 BPM</text>
<text x="62" y="129.3" font-size="2.7" fill="#1B1F24">Ne çizdiğini DÜŞÜNME. Elini bırak, kâğıdın üstünde gezdir. Zikzak, ilmek, çizik. Çok hafif bastır.</text>
<text x="62" y="132.9" font-size="2.6" fill="#7A828A">Bir şeye benzerse yanlış. Kutunun yarısı boş kalsın.</text>
<line x1="14" y1="136.2" x2="196" y2="136.2" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="139.9" font-size="4.6" font-weight="bold" fill="#1B1F24">2</text>
<text x="20" y="138.7" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">HOKUSAI</text>
<text x="20" y="142.2" font-size="2.5" fill="#7A828A">fırça / kalın keçeli</text>
<text x="58" y="138.7" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">150 BPM</text>
<text x="62" y="138.7" font-size="2.7" fill="#1B1F24">Bastırarak başla, hareket ederken gevşet. Kenarı YUVARLATMA — kır, basamak yap.</text>
<text x="62" y="142.3" font-size="2.6" fill="#7A828A">Tek vuruş, tek karar. Aynı kenara ikinci kez dokunma.</text>
<line x1="14" y1="145.6" x2="196" y2="145.6" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="149.3" font-size="4.6" font-weight="bold" fill="#1B1F24">3</text>
<text x="20" y="148.1" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">DELACROIX</text>
<text x="20" y="151.6" font-size="2.5" fill="#7A828A">kamış kalem / 0.5 fineliner</text>
<text x="58" y="148.1" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">120 BPM</text>
<text x="62" y="148.1" font-size="2.7" fill="#1B1F24">Doğru çizgiyi aramaya devam et ama HİÇBİRİNİ SİLME. Çizgi düz değil, dönen bir yay olsun.</text>
<text x="62" y="151.7" font-size="2.6" fill="#7A828A">Aynı kenarı en az üç kez çiz, üçü de kalsın. Silgi yasak.</text>
<line x1="14" y1="155" x2="196" y2="155" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="158.7" font-size="4.6" font-weight="bold" fill="#1B1F24">4</text>
<text x="20" y="157.5" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">VAN GOGH</text>
<text x="20" y="161" font-size="2.5" fill="#7A828A">kamış kalem / kalın fineliner</text>
<text x="58" y="157.5" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">100 BPM</text>
<text x="62" y="157.5" font-size="2.7" fill="#1B1F24">Uzun çizgi YOK. Kısa vuruşlarla doldur; her vuruş yüzeyin gittiği yöne baksın.</text>
<text x="62" y="161.1" font-size="2.6" fill="#7A828A">En az üç farklı yön kümesi. Kümelerin arası boş kalsın — beyaz kâğıt ışıktır.</text>
<line x1="14" y1="164.4" x2="196" y2="164.4" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="168.1" font-size="4.6" font-weight="bold" fill="#1B1F24">5</text>
<text x="20" y="166.9" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">REMBRANDT</text>
<text x="20" y="170.4" font-size="2.5" fill="#7A828A">0.3 fineliner</text>
<text x="58" y="166.9" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">80 BPM</text>
<text x="62" y="166.9" font-size="2.7" fill="#1B1F24">Işık alan hiçbir yere DOKUNMA. Sadece gölgeyi çiz, onu da tek yönlü demetlerle.</text>
<text x="62" y="170.5" font-size="2.6" fill="#7A828A">Kutunun en az %40'ı boş kalacak. Çapraz tarama sadece en koyu yerde.</text>
<line x1="14" y1="173.8" x2="196" y2="173.8" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="177.5" font-size="4.6" font-weight="bold" fill="#1B1F24">6</text>
<text x="20" y="176.3" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">BEN SHAHN</text>
<text x="20" y="179.8" font-size="2.5" fill="#7A828A">çini kalem / 0.3–0.5</text>
<text x="58" y="176.3" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">50 BPM</text>
<text x="62" y="176.3" font-size="2.7" fill="#1B1F24">Çok yavaş çiz ama BİR KEZ BİLE YÖNÜNÜ DEĞİŞTİRME. Yavaşlık titreklik demek değildir.</text>
<text x="62" y="179.9" font-size="2.6" fill="#7A828A">Kenarda tırtıklar kalsın. İç boş — her şey konturda.</text>
<line x1="14" y1="183.2" x2="196" y2="183.2" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="186.9" font-size="4.6" font-weight="bold" fill="#1B1F24">7</text>
<text x="20" y="185.7" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">DÜRER</text>
<text x="20" y="189.2" font-size="2.5" fill="#7A828A">0.1–0.2 fineliner</text>
<text x="58" y="185.7" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">40 BPM</text>
<text x="62" y="185.7" font-size="2.7" fill="#1B1F24">Çizgiler paralel aksın ve yüzeyin eğrisini takip etsin. Ortada bastır, uçlarda kaldır.</text>
<text x="62" y="189.3" font-size="2.6" fill="#7A828A">Koyulaştırmak için aralığı daralt + ikinci katmanı AÇIYLA bindir. Dik açı = ızgara = yanlış.</text>
<line x1="14" y1="192.6" x2="196" y2="192.6" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="196.3" font-size="4.6" font-weight="bold" fill="#1B1F24">8</text>
<text x="20" y="195.1" font-size="3.1" font-weight="bold" letter-spacing="0.5" fill="#1B1F24">SEURAT</text>
<text x="20" y="198.6" font-size="2.5" fill="#7A828A">6B / Conté — DOKULU KÂĞIT</text>
<text x="58" y="195.1" font-size="2.6" font-weight="bold" fill="#2A6289" text-anchor="end">40 BPM</text>
<text x="62" y="195.1" font-size="2.7" fill="#1B1F24">Kalemi YAN YATIR, çizgi çizme — sadece koyuluk bırak. Hiçbir yerde kenar olmasın.</text>
<text x="62" y="198.7" font-size="2.6" fill="#7A828A">En az 5 farklı koyuluk. Tek çizgi görünürse kutu yanlış. Bastırma, parmakla dağıtma.</text>
<line x1="14" y1="202" x2="196" y2="202" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="14" y="207.1" font-size="3.5" font-weight="bold" letter-spacing="1.0" fill="#2A6289">4 · KURALLAR</text>
<line x1="14" y1="208.7" x2="196" y2="208.7" stroke="#D5DAE0" stroke-width="0.35"/>
<text x="14" y="214.4" font-size="2.7" fill="#2A6289">▪</text>
<text x="17.4" y="214.4" font-size="2.7" fill="#1B1F24"><tspan font-weight="bold">Koyuluk bastırmakla değil iz eklemekle olur.</tspan> Yoğunluk = aralık × kalınlık × kesişim. Kaleme bastırmak yok.</text>
<text x="14" y="218.8" font-size="2.7" fill="#2A6289">▪</text>
<text x="17.4" y="218.8" font-size="2.7" fill="#1B1F24"><tspan font-weight="bold">Tempoyu sen seçmiyorsun, duyuyorsun.</tspan> Metronom çalarken çiz: hızlı kutuda oyalanma, yavaş kutuda acele etme.</text>
<text x="14" y="223.2" font-size="2.7" fill="#2A6289">▪</text>
<text x="17.4" y="223.2" font-size="2.7" fill="#1B1F24"><tspan font-weight="bold">Sekiz kutu birbirinden ayırt edilebilmeli.</tspan> Hepsi birbirine benziyorsa sekiz kez kendi çizgini çizmişsindir.</text>
<text x="14" y="227.6" font-size="2.7" fill="#2A6289">▪</text>
<text x="17.4" y="227.6" font-size="2.7" fill="#1B1F24"><tspan font-weight="bold">Bu bir kopya değil.</tspan> Kopyaladığın şey görüntü değil <tspan font-weight="bold">hareket.</tspan> Sanatçının çizimini değil, elini çalışıyorsun.</text>
<text x="14" y="232" font-size="2.7" fill="#2A6289">▪</text>
<text x="17.4" y="232" font-size="2.7" fill="#1B1F24"><tspan font-weight="bold">İz bir alettir, imza değil.</tspan> Dönem sonunda hangisinin sana yapıştığını yazacaksın.</text>
<rect x="14" y="238.6" width="182" height="20.4" fill="none" stroke="#1B1F24" stroke-width="0.7"/>
<text x="17" y="244" font-size="3.0" font-weight="bold" letter-spacing="0.8" fill="#1B1F24">TESLİM</text>
<text x="45" y="244" font-size="2.7" fill="#1B1F24">Sekiz kutulu sayfa; köşeye adın ve tarih. Sayfa dönem projesi dosyanın ilk bölümüne girer.</text>
<line x1="17" y1="247" x2="193" y2="247" stroke="#D5DAE0" stroke-width="0.3"/>
<text x="17" y="251.6" font-size="3.0" font-weight="bold" letter-spacing="0.8" fill="#2A6289">EV TEKRARI</text>
<text x="45" y="251.6" font-size="2.7" fill="#1B1F24">Seçtiğin <tspan font-weight="bold">iki kutuyu FARKLI BİR ALETLE</tspan> evde bir kez daha üret</text>
<text x="45" y="255.8" font-size="2.7" fill="#1B1F24">(tükenmez, çini kalem, kamış, çöp şiş + mürekkep). Haftaya getir.</text>
<text x="14" y="289.5" font-size="2.45" font-weight="bold" fill="#1B1F24">İZ BİR ALETTİR, İMZA DEĞİLDİR.</text>
<text x="196" y="289.5" font-size="2.45" fill="#7A828A" text-anchor="end">AD SOYAD ............................................   TARİH ................</text>
</g></svg>